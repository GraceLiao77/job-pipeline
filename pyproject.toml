[project]
name = "job-pipeline"
version = "0.1.0"
description = "Job-application pipeline: Telegram review, tailored CVs via career-craft, Notion tracking"
readme = "README.md"
authors = [
    { name = "GraceLiao77" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot[job-queue]>=22.8",
]

[project.scripts]
job-pipeline = "job_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
